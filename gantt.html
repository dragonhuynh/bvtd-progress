<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biểu Đồ Gantt — BVTD CS2</title>
<style>
:root{
  --bg:#f5e6d8; --sidebar:#1c2341; --accent:#f47c3c; --accent2:#e06528;
  --white:#fff; --text:#1a202c; --muted:#718096; --border:#e2e8f0;
  --green:#48bb78; --blue:#4299e1; --red:#f56565; --r:12px;
  --sh:0 2px 12px rgba(0,0,0,.08);
  --col-id:52px; --col-sub:300px; --col-st:148px; --col-dp:96px; --day-w:38px; --row-h:44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;
  font-family:'Segoe UI',-apple-system,sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);}

/* Sidebar */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:64px;
  background:var(--sidebar);display:flex;flex-direction:column;
  align-items:center;padding:14px 0;z-index:100;gap:4px;
}
.sb-logo{
  width:38px;height:38px;background:var(--accent);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;color:#fff;margin-bottom:10px;
}
.sb-icon{
  width:42px;height:42px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;
  color:rgba(255,255,255,.5);transition:all .15s;border-left:3px solid transparent;
}
.sb-icon:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
.sb-icon.active{color:#fff;background:rgba(244,124,60,.18);border-left-color:var(--accent);}
.sb-bottom{margin-top:auto;}

/* Main */
.main{margin-left:64px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Topbar */
.topbar{
  height:54px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:0;flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.tb-title{font-size:16px;font-weight:700;color:var(--text);}
.tb-sub{font-size:12px;color:var(--muted);margin-left:10px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:6px 12px;width:210px;
  transition:border .15s;
}
.search-box:focus-within{border-color:var(--accent);}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%;}
.tb-icon2{
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--muted);position:relative;
  transition:background .12s;
}
.tb-icon2:hover{background:var(--bg);}
.notif-dot{
  position:absolute;top:7px;right:7px;width:7px;height:7px;
  background:var(--red);border-radius:50%;border:2px solid var(--white);
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;cursor:pointer;
}

/* Stats strip */
.stats-strip{
  display:flex;gap:12px;padding:12px 22px;background:var(--white);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.stat-pill{
  display:flex;align-items:center;gap:8px;background:var(--bg);
  border-radius:8px;padding:7px 14px;
}
.stat-pill-num{font-size:18px;font-weight:800;line-height:1;}
.stat-pill-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.c-blue{color:var(--blue);} .c-green{color:var(--green);}
.c-orange{color:var(--accent);} .c-red{color:var(--red);}

/* Filter bar */
.filterbar{
  height:44px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:4px;flex-shrink:0;
}
.ft{
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;color:var(--muted);
  display:flex;align-items:center;gap:3px;white-space:nowrap;
  transition:all .12s;-webkit-user-select:none;user-select:none;
}
.ft:hover{background:var(--bg);color:var(--text);}
.ft.active{background:rgba(244,124,60,.12);color:var(--accent2);border-color:rgba(244,124,60,.4);}
.ft-cnt{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;background:#e2e8f0;border-radius:10px;
  font-size:11px;padding:0 4px;margin-left:3px;color:var(--muted);
}
.ft.active .ft-cnt{background:rgba(244,124,60,.2);color:var(--accent2);}
.nhom-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.vdiv{width:1px;background:var(--border);height:20px;margin:0 6px;flex-shrink:0;}
.fb-right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.nav-btn{
  height:30px;padding:0 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--white);cursor:pointer;color:var(--text);font-size:12px;
  display:flex;align-items:center;gap:4px;transition:background .12s;font-weight:500;
}
.nav-btn:hover{background:var(--bg);}
.nav-btn.today{font-weight:700;color:var(--accent2);border-color:rgba(244,124,60,.5);}
.date-lbl{font-size:12px;font-weight:600;color:var(--text);min-width:140px;text-align:center;}

/* Content */
.content{display:flex;flex:1;overflow:hidden;}

/* Left panel */
.lp{
  flex-shrink:0;
  width:calc(var(--col-id) + var(--col-sub) + var(--col-st) + var(--col-dp));
  display:flex;flex-direction:column;
  border-right:2px solid var(--border);background:var(--white);overflow:hidden;
}
.lp-head{
  height:38px;display:flex;align-items:center;
  border-bottom:1px solid var(--border);background:#fdf8f5;flex-shrink:0;
}
.lh{padding:0 14px;font-weight:700;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;}
.lh-id{width:var(--col-id);text-align:center;}
.lh-sub{width:var(--col-sub);}
.lh-st{width:var(--col-st);padding:0 10px;}
.lh-dp{flex:1;padding:0 10px;}
.lp-body{flex:1;overflow-y:scroll;overflow-x:hidden;}
.lp-body::-webkit-scrollbar{width:0;}

/* Task row */
.tr{
  display:flex;align-items:center;height:var(--row-h);
  border-bottom:1px solid var(--border);transition:background .1s;cursor:default;
}
.tr:hover{background:#fdf6ee;}
.tr-id{width:var(--col-id);padding:0 6px;text-align:center;flex-shrink:0;}
.tr-id-badge{font-size:10px;font-weight:700;color:var(--muted);background:#f0f4f8;padding:2px 5px;border-radius:4px;white-space:nowrap;}
.tr-sub{
  width:var(--col-sub);padding:0 10px 0 0;display:flex;
  align-items:center;gap:8px;overflow:hidden;min-width:0;
}
.tr-sub-txt{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13px;color:var(--text);font-weight:500;
}
.nd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.nd-hanh_chanh{background:#f59e0b;}
.nd-chuyen_mon{background:#8b5cf6;}
.nd-quan_ly_khac{background:#06b6d4;}
.tr-st{width:var(--col-st);padding:0 10px;flex-shrink:0;}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  white-space:nowrap;
}
.badge.da_hoan_thanh{background:#f0fff4;color:#276749;border:1px solid #9ae6b430;}
.badge.dang_thuc_hien{background:#ebf8ff;color:#2b6cb0;border:1px solid #90cdf430;}
.badge.tre_deadline  {background:#fff5f5;color:#c53030;border:1px solid #fc8c8c30;}
.bdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.da_hoan_thanh  .bdot{background:var(--green);}
.dang_thuc_hien .bdot{background:var(--blue);}
.tre_deadline   .bdot{background:var(--red);}
.tr-dp{flex:1;padding:0 10px;font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}

/* Gantt panel */
.gp{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--white);}
.gp-head{
  height:38px;border-bottom:1px solid var(--border);
  background:#fdf8f5;flex-shrink:0;overflow:hidden;
}
.gp-dates{display:flex;white-space:nowrap;height:100%;}
.gdc{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-right:1px solid #f0e8df;font-size:11px;
}
.gdc-m{font-size:10px;color:var(--muted);line-height:1;font-weight:600;}
.gdc-d{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;}
.gdc-d.wknd{color:#c0a090;}
.gdc-today{
  width:22px;height:22px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800;
}
.gp-body{flex:1;overflow:auto;}
.gp-body::-webkit-scrollbar{height:6px;width:0;}
.gp-body::-webkit-scrollbar-thumb{background:#d4c5b5;border-radius:3px;}

/* Gantt row */
.gr{position:relative;border-bottom:1px solid var(--border);}
.gr:hover{background:#fdf6ee;}
.gr-bg{position:absolute;inset:0;display:flex;pointer-events:none;}
.gr-col{flex-shrink:0;height:100%;border-right:1px solid #f3ede7;}
.gr-col.today-bg{background:rgba(244,124,60,.08);}
.gr-col.wknd-bg{background:rgba(0,0,0,.018);}

/* Bar */
.bar{
  position:absolute;top:50%;transform:translateY(-50%);
  height:26px;border-radius:6px;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;padding:0 10px;
  font-size:11px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:0 1px 4px rgba(0,0,0,.14);transition:filter .12s,box-shadow .12s;
}
.bar:hover{filter:brightness(1.06);box-shadow:0 3px 10px rgba(0,0,0,.22);}
.bar.da_hoan_thanh {background:#68d391;color:#1a4731;}
.bar.dang_thuc_hien{background:#63b3ed;color:#1a365d;}
.bar.tre_deadline  {background:#fc8181;color:#63171b;}
.bar.nhac          {outline:2px solid #c53030;outline-offset:1px;}
.bar-arr{
  position:absolute;right:-9px;top:50%;transform:translateY(-50%);
  width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
}
.bar.da_hoan_thanh  .bar-arr{border-left:9px solid #68d391;}
.bar.dang_thuc_hien .bar-arr{border-left:9px solid #63b3ed;}
.bar.tre_deadline   .bar-arr{border-left:9px solid #fc8181;}

/* Today line */
.today-line{
  position:absolute;top:0;bottom:0;width:2px;
  background:var(--accent);opacity:.7;pointer-events:none;z-index:10;
}

/* Summary strip */
.strip{
  height:40px;background:var(--white);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:20px;flex-shrink:0;
  box-shadow:0 -1px 4px rgba(0,0,0,.04);
}
.si{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500;}
.si strong{font-weight:800;}
.si.g{color:#276749;} .si.b{color:#2b6cb0;} .si.r{color:#c53030;}
.legend{display:flex;gap:14px;align-items:center;margin-left:auto;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:500;}
.li-dot{width:10px;height:10px;border-radius:3px;}

/* Tooltip */
.tip{
  position:fixed;z-index:9999;background:#1c2341;color:#e2e8f0;
  padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.7;
  max-width:300px;box-shadow:0 8px 28px rgba(0,0,0,.32);
  pointer-events:none;display:none;
}
.tip.show{display:block;}
.tip-title{color:#fff;font-weight:700;margin-bottom:4px;font-size:13px;}

/* ── Mobile ── */
@media (max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  :root{--col-sub:150px;--col-st:0px;--col-dp:0px;}
  .lh-st,.lh-dp,.tr-st,.tr-dp{display:none;}
  .lp{width:calc(var(--col-id) + var(--col-sub));min-width:0;}
  .topbar{padding:0 14px;}
  .search-box{width:140px;}
  .filterbar{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .stats-strip{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .strip .legend{display:none;}
  .tb-icon2{display:none;}
}
@media (max-width:480px){
  :root{--col-id:40px;--col-sub:110px;}
  .search-box{display:none;}
  .strip{gap:8px;font-size:11px;}
  .stat-pill{padding:5px 10px;}
  .stat-pill-num{font-size:15px;}
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sb-logo">B</div>
  <div class="sb-icon active" title="Tổng quan">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </div>
  <div class="sb-icon" title="Danh sách" onclick="window.location='tien_do.html'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>

      <circle cx="3" cy="12" r="1" fill="currentColor"/>
      <circle cx="3" cy="18" r="1" fill="currentColor"/>
    </svg>
  </div>
  <div class="sb-icon" title="Dashboard" onclick="window.location='dashboard.html'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
    </svg>
  </div>
  <div class="sb-icon" title="Báo cáo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <polyline points="14,2 14,8 20,8"/>
    </svg>
  </div>
  <div class="sb-icon sb-bottom" title="Cài đặt">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <span class="tb-title">&#x1F4C5; Biểu Đồ Gantt</span>
    <span class="tb-sub">BVTD Cơ Sở 2 — 10/05/2026</span>
    <div class="tb-right">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Tìm đầu việc, phòng...">
      </div>
      <div class="tb-icon2" title="Thông báo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="notif-dot"></span>
      </div>
      <div class="avatar">B</div>
    </div>
  </div>

  <!-- Stats strip -->
  <div class="stats-strip" id="statsStrip"></div>

  <!-- Filter bar -->
  <div class="filterbar">
    <div class="ft active" data-filter="all" onclick="setFilter('all',this)">
      Tất cả <span class="ft-cnt" id="cnt-all">—</span>
    </div>
    <div class="ft" data-filter="da_hoan_thanh" onclick="setFilter('da_hoan_thanh',this)">
      &#x2705; Hoàn thành <span class="ft-cnt" id="cnt-done">—</span>
    </div>
    <div class="ft" data-filter="dang_thuc_hien" onclick="setFilter('dang_thuc_hien',this)">
      &#x1F504; Đang thực hiện <span class="ft-cnt" id="cnt-inp">—</span>
    </div>
    <div class="ft" data-filter="tre_deadline" onclick="setFilter('tre_deadline',this)">
      &#x26A0;&#xFE0F; Trễ deadline <span class="ft-cnt" id="cnt-late">—</span>
    </div>
    <div class="vdiv"></div>
    <div class="ft" data-nhom="hanh_chanh" onclick="setNhom('hanh_chanh',this)">
      <span class="nhom-pip" style="background:#f59e0b"></span>Hành chính
    </div>
    <div class="ft" data-nhom="chuyen_mon" onclick="setNhom('chuyen_mon',this)">
      <span class="nhom-pip" style="background:#8b5cf6"></span>Chuyên môn
    </div>
    <div class="ft" data-nhom="quan_ly_khac" onclick="setNhom('quan_ly_khac',this)">
      <span class="nhom-pip" style="background:#06b6d4"></span>Quản lý
    </div>
    <div class="fb-right">
      <button type="button" class="nav-btn" onclick="shiftView(-14)" title="Lùi 2 tuần">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
      <span class="date-lbl" id="dateLbl">…</span>
      <button type="button" class="nav-btn" onclick="shiftView(14)" title="Tiến 2 tuần">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9,18 15,12 9,6"/>
        </svg>
      </button>
      <button type="button" class="nav-btn today" onclick="goToday()">Hôm nay</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="lp">
      <div class="lp-head">
        <div class="lh lh-id">ID</div>
        <div class="lh lh-sub">Đầu việc</div>
        <div class="lh lh-st">Trạng thái</div>
        <div class="lh lh-dp">Phòng</div>
      </div>
      <div class="lp-body" id="lpBody"></div>
    </div>
    <div class="gp">
      <div class="gp-head">
        <div class="gp-dates" id="gpDates"></div>
      </div>
      <div class="gp-body" id="gpBody" onscroll="syncG(this)"></div>
    </div>
  </div>

  <!-- Summary strip -->
  <div class="strip">
    <div class="si">Tổng: <strong id="totC">—</strong> đầu việc hiển thị</div>
    <div class="si g">&#x2705; Hoàn thành: <strong id="doneC">—</strong></div>
    <div class="si b">&#x1F504; Đang thực hiện: <strong id="inpC">—</strong></div>
    <div class="si r">&#x26A0; Trễ deadline: <strong id="lateC">—</strong></div>
    <div class="legend">
      <div class="li"><div class="li-dot" style="background:#f59e0b"></div>Hành chính</div>
      <div class="li"><div class="li-dot" style="background:#8b5cf6"></div>Chuyên môn</div>
      <div class="li"><div class="li-dot" style="background:#06b6d4"></div>Quản lý</div>
    </div>
  </div>
</div>

T trong Q2/2026; trình phương án 08.05", "nhom": "quan_ly_khac", "phong_chinh": "TCCB", "phong_phoi_hop": "", "bat_dau": "2026-05-05", "ket_thuc": "2026-05-08", "trang_thai": "tre_deadline", "so_lan_nhac": "1", "ghi_chu": "", "nguon_van_ban": "Biên bản 2026-05-05"}, {"id": "442", "ten_dau_viec": "TCCB triển khai đào tạo nhân sự sử dụng thành thạo máy CT trước 26/05 (BV LVT/Chợ Rẫy/Hòa Hảo)", "nhom": "quan_ly_khac", "phong_chinh": "TCCB", "phong_phoi_hop": "", "bat_dau": "2026-05-05", "ket_thuc": "2026-05-26", "trang_thai": "dang_thuc_hien", "so_lan_nhac": "1", "ghi_chu": "", "nguon_van_ban": "Biên bản 2026-05-05"}, {"id": "443", "ten_dau_viec": "KHTH + Điều dưỡng + TCCB vẽ sơ đồ nhân sự từng khoa (tên cụ thể BS/ĐD/HS/KTV)", "nhom": "quan_ly_khac", "phong_chinh": "KHTH", "phong_phoi_hop": "Điều dưỡng|TCCB", "bat_dau": "2026-05-05", "ket_thuc": "2026-05-12", "trang_thai": "dang_thuc_hien", "so_lan_nhac": "1", "ghi_chu": "", "nguon_van_ban": "Biên bản 2026-05-05"}, {"id": "444", "ten_dau_viec": "TCCB rà soát nhân sự CS2 cần truyền tải năng lượng tích cực", "nhom": "quan_ly_khac", "phong_chinh": "TCCB", "phong_phoi_hop": "", "bat_dau": "2026-05-05", "ket_thuc": "2026-05-12", "trang_thai": "dang_thuc_hien", "so_lan_nhac": "1", "ghi_chu": "", "nguon_van_ban": "Biên bản 2026-05-05"}, {"id": "445", "ten_dau_viec": "TCCB + KHTH + Điều dưỡng bố trí lịch trực/làm việc đúng chính sách; ngày nghỉ/lễ/Tết chu đáo", "nhom": "quan_ly_khac", "phong_chinh": "TCCB", "phong_phoi_hop": "KHTH|Điều dưỡng", "bat_dau": "2026-05-05", "ket_thuc": "2026-05-12", "trang_thai": "dang_thuc_hien", "so_lan_nhac": "1", "ghi_chu": "", "nguon_van_ban": "Biên bản 2026-05-05"}];
const TODAY_S = '2026-05-10';
const DAY_W   = window.innerWidth < 480 ? 24 : (window.innerWidth < 768 ? 28 : 38);
const VIEW_DAYS = window.innerWidth < 480 ? 21 : (window.innerWidth < 768 ? 28 : 42);
const ROW_H = 44;
const MONTHS  = ['Th1','Th2','Th3','Th4','Th5','Th6','Th7','Th8','Th9','Th10','Th11','Th12'];
const ST_LBL  = {da_hoan_thanh:'Hoàn thành',dang_thuc_hien:'Đang thực hiện',tre_deadline:'Trễ deadline'};
const NM_LBL  = {hanh_chanh:'Hành chính',chuyen_mon:'Chuyên môn',quan_ly_khac:'Quản lý khác'};

let vis=[], statusF='all', nhomF=null, viewStart=null;

function pDate(s){
  if(!s||!s.trim()) return null;
  const p=s.trim().split('-');
  if(p.length!==3) return null;
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d)?null:d;
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function dDiff(a,b){return Math.round((b-a)/864e5);}
function today0(){const t=pDate(TODAY_S);return t;}
function fmt(d){return d?`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`:'—';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function set(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}

// Init stats
(function(){
  const done =TASKS.filter(t=>t.trang_thai==='da_hoan_thanh').length;
  const inp  =TASKS.filter(t=>t.trang_thai==='dang_thuc_hien').length;
  const late =TASKS.filter(t=>t.trang_thai==='tre_deadline').length;
  const pct  =TASKS.length?Math.round(done/TASKS.length*100):0;
  document.getElementById('statsStrip').innerHTML=`
    <div class="stat-pill"><div><div class="stat-pill-num c-blue">${TASKS.length}</div><div class="stat-pill-lbl">Tổng đầu việc</div></div></div>
    <div class="stat-pill"><div><div class="stat-pill-num c-green">${done}</div><div class="stat-pill-lbl">Hoàn thành</div></div></div>
    <div class="stat-pill"><div><div class="stat-pill-num c-orange">${inp}</div><div class="stat-pill-lbl">Đang thực hiện</div></div></div>
    <div class="stat-pill"><div><div class="stat-pill-num c-red">${late}</div><div class="stat-pill-lbl">Trễ deadline</div></div></div>
    <div class="stat-pill"><div><div class="stat-pill-num" style="color:#9f7aea">${pct}%</div><div class="stat-pill-lbl">Tỉ lệ hoàn thành</div></div></div>
  `;
  set('cnt-all', TASKS.length);
  set('cnt-done',done); set('cnt-inp',inp); set('cnt-late',late);
})();

function setFilter(s,el){
  document.querySelectorAll('[data-filter]').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); statusF=s; applyF();
}
function setNhom(n,el){
  if(nhomF===n){document.querySelectorAll('[data-nhom]').forEach(e=>e.classList.remove('active'));nhomF=null;}
  else{document.querySelectorAll('[data-nhom]').forEach(e=>e.classList.remove('active'));el.classList.add('active');nhomF=n;}
  applyF();
}
function applyF(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  vis=TASKS.filter(t=>{
    if(statusF!=='all'&&t.trang_thai!==statusF)return false;
    if(nhomF&&t.nhom!==nhomF)return false;
    if(q&&!t.ten_dau_viec.toLowerCase().includes(q)&&!t.phong_chinh.toLowerCase().includes(q))return false;
    return true;
  });
  render();
}
document.getElementById('searchInput').addEventListener('input',applyF);

function shiftView(n){viewStart=addDays(viewStart,n);renderG();}
function goToday(){viewStart=addDays(today0(),-10);renderG();}

function render(){renderL();renderG();}

function renderL(){
  const c=document.getElementById('lpBody');c.innerHTML='';
  if(!vis.length){c.innerHTML='<div style="padding:20px 16px;color:#718096;font-size:13px">Không có đầu việc phù hợp.</div>';return;}
  const done=vis.filter(t=>t.trang_thai==='da_hoan_thanh').length;
  const inp=vis.filter(t=>t.trang_thai==='dang_thuc_hien').length;
  const late=vis.filter(t=>t.trang_thai==='tre_deadline').length;
  set('totC',vis.length);set('doneC',done);set('inpC',inp);set('lateC',late);
  vis.forEach((t,i)=>{
    const sc=t.trang_thai||'dang_thuc_hien';
    const div=document.createElement('div');
    div.className='tr';div.dataset.i=i;
    div.innerHTML=`
      <div class="tr-id"><span class="tr-id-badge">${esc(t.id)}</span></div>
      <div class="tr-sub">
        <span class="nd nd-${t.nhom||'hanh_chanh'}" title="${esc(NM_LBL[t.nhom]||t.nhom)}"></span>
        <span class="tr-sub-txt" title="${esc(t.ten_dau_viec)}">${esc(t.ten_dau_viec)}</span>
      </div>
      <div class="tr-st"><span class="badge ${sc}"><span class="bdot"></span>${ST_LBL[sc]||sc}</span></div>
      <div class="tr-dp" title="${esc(t.phong_chinh)}">${esc(t.phong_chinh)}</div>`;
    div.addEventListener('mouseenter',()=>hl(i,true));
    div.addEventListener('mouseleave',()=>hl(i,false));
    c.appendChild(div);
  });
}

function renderG(){
  const tod=today0();
  document.getElementById('dateLbl').textContent=`${fmt(viewStart)} – ${fmt(addDays(viewStart,VIEW_DAYS-1))}`;
  // Dates header
  const dates=document.getElementById('gpDates');dates.innerHTML='';
  let prevM=-1;
  for(let i=0;i<VIEW_DAYS;i++){
    const d=addDays(viewStart,i);
    const isT=d.getTime()===tod.getTime();
    const mC=d.getMonth()!==prevM;prevM=d.getMonth();
    const cell=document.createElement('div');
    cell.className='gdc';cell.style.width=DAY_W+'px';
    const wk=d.getDay()===0||d.getDay()===6;
    cell.innerHTML=(mC?`<span class="gdc-m">${MONTHS[d.getMonth()]}</span>`:`<span class="gdc-m" style="visibility:hidden">.</span>`)
      +(isT?`<span class="gdc-today">${d.getDate()}</span>`
           :`<span class="gdc-d${wk?' wknd':''}">${d.getDate()}</span>`);
    dates.appendChild(cell);
  }
  // Body rows
  const body=document.getElementById('gpBody');
  const pST=body.scrollTop;body.innerHTML='';
  const totalW=VIEW_DAYS*DAY_W;
  const todOff=dDiff(viewStart,tod);
  vis.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='gr';row.dataset.i=i;
    row.style.cssText=`width:${totalW}px;height:${ROW_H}px;`;
    // BG
    const bg=document.createElement('div');bg.className='gr-bg';
    for(let j=0;j<VIEW_DAYS;j++){
      const d2=addDays(viewStart,j);
      const col=document.createElement('div');col.className='gr-col';
      col.style.width=DAY_W+'px';
      if(d2.getTime()===tod.getTime())col.classList.add('today-bg');
      else if(d2.getDay()===0||d2.getDay()===6)col.classList.add('wknd-bg');
      bg.appendChild(col);
    }
    row.appendChild(bg);
    // Today vertical line
    if(todOff>=0&&todOff<VIEW_DAYS){
      const line=document.createElement('div');
      line.className='today-line';
      line.style.left=(todOff*DAY_W+DAY_W/2-1)+'px';
      row.appendChild(line);
    }
    // Bar
    const start=pDate(t.bat_dau);
    const end=t.ket_thuc?pDate(t.ket_thuc):null;
    if(start){
      const openEnd=!end;
      const barEnd=end||addDays(tod,5);
      const s0=dDiff(viewStart,start);
      const e0=dDiff(viewStart,barEnd);
      if(e0>=0&&s0<VIEW_DAYS){
        const lx=Math.max(0,s0*DAY_W);
        const rawW=(e0-Math.max(0,s0))*DAY_W+DAY_W;
        const bw=Math.min(Math.max(rawW,8),totalW-lx-(openEnd?10:0));
        if(bw>4){
          const sc=t.trang_thai||'dang_thuc_hien';
          const bar=document.createElement('div');
          bar.className=`bar ${sc}${+t.so_lan_nhac>1?' nhac':''}`;
          bar.style.cssText=`left:${lx}px;width:${bw}px;`;
          bar.textContent=t.ten_dau_viec.length>34?t.ten_dau_viec.slice(0,34)+'…':t.ten_dau_viec;
          if(openEnd){
            bar.style.overflow='visible';
            const arr=document.createElement('span');arr.className='bar-arr';bar.appendChild(arr);
          }
          bar.addEventListener('mouseenter',e=>showTip(e,t));
          bar.addEventListener('mousemove', e=>moveTip(e));
          bar.addEventListener('mouseleave',  hideTip);
          row.appendChild(bar);
        }
      }
    }
    row.addEventListener('mouseenter',()=>hl(i,true));
    row.addEventListener('mouseleave',()=>hl(i,false));
    body.appendChild(row);
  });
  body.scrollTop=pST;
  attachLS();
}

let syncing=false;
function syncG(el){if(syncing)return;syncing=true;document.getElementById('lpBody').scrollTop=el.scrollTop;syncing=false;}
function attachLS(){
  document.getElementById('lpBody').onscroll=function(){
    if(syncing)return;syncing=true;document.getElementById('gpBody').scrollTop=this.scrollTop;syncing=false;
  };
}
function hl(i,on){
  const bg=on?'#fdf6ee':'';
  const lr=document.getElementById('lpBody').children[i];
  const gr=document.getElementById('gpBody').children[i];
  if(lr)lr.style.background=bg;if(gr)gr.style.background=bg;
}
function showTip(e,t){
  const tip=document.getElementById('tip');
  const sc=t.trang_thai||'dang_thuc_hien';
  const dept=t.phong_phoi_hop?`${esc(t.phong_chinh)} + ${t.phong_phoi_hop.split('|').join(', ')}`:`${esc(t.phong_chinh)}`;
  tip.innerHTML=`
    <div class="tip-title">${esc(t.ten_dau_viec)}</div>
    <div>&#x1F4CB; ${ST_LBL[sc]||sc} | ${NM_LBL[t.nhom]||t.nhom}</div>
    <div>&#x1F3E5; ${dept}</div>
    <div>&#x1F4C5; ${fmt(pDate(t.bat_dau))} &#8594; ${t.ket_thuc?fmt(pDate(t.ket_thuc)):'<span style="color:#fc8181">Chưa xác định</span>'}</div>
    ${t.ghi_chu?`<div style="margin-top:4px;color:#a0aec0;font-style:italic">${esc(t.ghi_chu)}</div>`:''}    ${+t.so_lan_nhac>1?`<div style="color:#fbd38d">&#x21BB; Nhắc lại ${t.so_lan_nhac} lần</div>`:''}`;
  tip.classList.add('show');moveTip(e);
}
function moveTip(e){
  const tip=document.getElementById('tip');
  tip.style.cssText='display:block;left:-9999px;top:-9999px;';
  const r=tip.getBoundingClientRect();
  let x=e.clientX+16,y=e.clientY-10;
  if(x+r.width>window.innerWidth)x=e.clientX-r.width-16;
  if(y+r.height>window.innerHeight)y=window.innerHeight-r.height-8;
  tip.style.cssText=`display:block;left:${x}px;top:${y}px;`;
}
function hideTip(){document.getElementById('tip').classList.remove('show');}

// Boot
viewStart=addDays(today0(),-10);
applyF();
</script>
</body>
</html>
